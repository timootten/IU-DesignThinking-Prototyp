<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HabitForge — Focus & Reminders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: { "emerald-glow": "#10b981", "lime-glow": "#84cc16" },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-in-up {
        animation: fadeInUp 0.4s ease forwards;
      }
      .glass {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      @keyframes pulse-ring {
        0% {
          transform: scale(0.95);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.3;
        }
        100% {
          transform: scale(0.95);
          opacity: 0.7;
        }
      }
      .timer-ring-pulse {
        animation: pulse-ring 2s ease-in-out infinite;
      }
      @keyframes tick {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.02);
        }
      }
      .tick {
        animation: tick 1s ease-in-out infinite;
      }
    </style>
  </head>

  <body
    class="bg-gray-50 text-gray-800 dark:bg-gray-950 dark:text-gray-100 min-h-screen pb-24 transition-colors duration-300"
  >
    <!-- ─── Top Bar ─── -->
    <header
      class="sticky top-0 z-50 bg-white/80 dark:bg-gray-900/80 glass border-b border-gray-200 dark:border-gray-800"
    >
      <div
        class="max-w-2xl mx-auto flex items-center justify-between px-4 h-14"
      >
        <div class="flex items-center gap-2">
          <div
            class="w-9 h-9 bg-gradient-to-br from-emerald-500 to-lime-500 rounded-xl flex items-center justify-center"
          >
            <i class="fas fa-bolt text-white text-sm"></i>
          </div>
          <span
            class="text-lg font-extrabold bg-gradient-to-r from-emerald-500 to-lime-500 bg-clip-text text-transparent"
            >HabitForge</span
          >
        </div>
        <button
          onclick="toggleTheme()"
          class="w-9 h-9 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center hover:scale-110 transition"
        >
          <i id="theme-icon" class="fas fa-sun text-yellow-400"></i>
        </button>
      </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 pt-6 space-y-6">
      <!-- ═══ FOCUS TIMER ═══ -->
      <section
        class="bg-gradient-to-br from-indigo-600 to-purple-700 rounded-2xl p-6 shadow-xl text-white fade-in-up relative overflow-hidden"
      >
        <!-- Decorative rings -->
        <div
          class="absolute -top-10 -right-10 w-40 h-40 border-2 border-white/10 rounded-full"
        ></div>
        <div
          class="absolute -bottom-8 -left-8 w-32 h-32 border-2 border-white/10 rounded-full"
        ></div>

        <div class="relative z-10">
          <div class="flex items-center justify-between mb-6">
            <div>
              <h2 class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-crosshairs"></i> Focus Timer
              </h2>
              <p class="text-indigo-200 text-sm mt-0.5">
                Deep work mode — eliminate distractions
              </p>
            </div>
            <div class="flex gap-2">
              <button
                onclick="setPreset(15)"
                class="preset-btn px-3 py-1.5 bg-white/20 hover:bg-white/30 text-white text-xs font-bold rounded-lg transition"
              >
                15m
              </button>
              <button
                onclick="setPreset(25)"
                class="preset-btn px-3 py-1.5 bg-white/20 hover:bg-white/30 text-white text-xs font-bold rounded-lg transition"
              >
                25m
              </button>
              <button
                onclick="setPreset(45)"
                class="preset-btn px-3 py-1.5 bg-white/20 hover:bg-white/30 text-white text-xs font-bold rounded-lg transition"
              >
                45m
              </button>
            </div>
          </div>

          <!-- Timer Display -->
          <div class="flex flex-col items-center mb-6">
            <div class="relative">
              <!-- Ring SVG -->
              <svg class="w-48 h-48" viewBox="0 0 200 200">
                <circle
                  cx="100"
                  cy="100"
                  r="90"
                  fill="none"
                  stroke="rgba(255,255,255,0.15)"
                  stroke-width="8"
                />
                <circle
                  id="timer-ring"
                  cx="100"
                  cy="100"
                  r="90"
                  fill="none"
                  stroke="white"
                  stroke-width="8"
                  stroke-linecap="round"
                  stroke-dasharray="565.48"
                  stroke-dashoffset="0"
                  transform="rotate(-90 100 100)"
                  class="transition-all duration-1000"
                />
              </svg>
              <div
                class="absolute inset-0 flex flex-col items-center justify-center"
              >
                <span
                  id="timer-display"
                  class="text-5xl font-extrabold tracking-tight font-mono"
                  >25:00</span
                >
                <span id="timer-label" class="text-indigo-200 text-sm mt-1"
                  >Ready</span
                >
              </div>
            </div>
          </div>

          <!-- Controls -->
          <div class="flex items-center justify-center gap-3">
            <button
              onclick="resetTimer()"
              class="w-12 h-12 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center transition"
            >
              <i class="fas fa-redo text-white"></i>
            </button>
            <button
              id="timer-start-btn"
              onclick="toggleTimer()"
              class="w-16 h-16 rounded-full bg-white text-indigo-600 hover:bg-indigo-100 flex items-center justify-center transition shadow-xl"
            >
              <i id="timer-play-icon" class="fas fa-play text-xl ml-0.5"></i>
            </button>
            <button
              onclick="skipTimer()"
              class="w-12 h-12 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center transition"
            >
              <i class="fas fa-forward text-white"></i>
            </button>
          </div>
        </div>
      </section>

      <!-- ═══ AUTO-SCHEDULE ═══ -->
      <section
        class="bg-white dark:bg-gray-900 rounded-2xl p-5 border border-gray-200 dark:border-gray-800 shadow-sm fade-in-up"
        style="animation-delay: 0.1s"
      >
        <div class="flex items-center justify-between mb-4">
          <h2
            class="text-sm font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider"
          >
            Auto-Schedule Focus
          </h2>
          <button
            class="text-xs text-emerald-600 dark:text-emerald-400 font-semibold hover:underline"
          >
            + Add Slot
          </button>
        </div>

        <!-- Weekly Calendar Grid -->
        <div class="grid grid-cols-7 gap-1.5 mb-4">
          <!-- Day Headers -->
          <div class="text-center text-[10px] font-bold text-gray-400 pb-1">
            Mon
          </div>
          <div class="text-center text-[10px] font-bold text-gray-400 pb-1">
            Tue
          </div>
          <div class="text-center text-[10px] font-bold text-gray-400 pb-1">
            Wed
          </div>
          <div class="text-center text-[10px] font-bold text-gray-400 pb-1">
            Thu
          </div>
          <div class="text-center text-[10px] font-bold text-gray-400 pb-1">
            Fri
          </div>
          <div class="text-center text-[10px] font-bold text-gray-400 pb-1">
            Sat
          </div>
          <div class="text-center text-[10px] font-bold text-gray-400 pb-1">
            Sun
          </div>

          <!-- Time Slots Row 1: Morning -->
          <div
            class="h-10 bg-indigo-100 dark:bg-indigo-500/20 rounded-lg flex items-center justify-center text-[10px] font-bold text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-500/30"
          >
            6AM
          </div>
          <div
            class="h-10 bg-gray-50 dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700"
          ></div>
          <div
            class="h-10 bg-indigo-100 dark:bg-indigo-500/20 rounded-lg flex items-center justify-center text-[10px] font-bold text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-500/30"
          >
            6AM
          </div>
          <div
            class="h-10 bg-gray-50 dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700"
          ></div>
          <div
            class="h-10 bg-indigo-100 dark:bg-indigo-500/20 rounded-lg flex items-center justify-center text-[10px] font-bold text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-500/30"
          >
            6AM
          </div>
          <div
            class="h-10 bg-emerald-100 dark:bg-emerald-500/20 rounded-lg flex items-center justify-center text-[10px] font-bold text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-500/30"
          >
            8AM
          </div>
          <div
            class="h-10 bg-emerald-100 dark:bg-emerald-500/20 rounded-lg flex items-center justify-center text-[10px] font-bold text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-500/30"
          >
            8AM
          </div>

          <!-- Time Slots Row 2: Evening -->
          <div
            class="h-10 bg-gray-50 dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700"
          ></div>
          <div
            class="h-10 bg-purple-100 dark:bg-purple-500/20 rounded-lg flex items-center justify-center text-[10px] font-bold text-purple-600 dark:text-purple-400 border border-purple-200 dark:border-purple-500/30"
          >
            7PM
          </div>
          <div
            class="h-10 bg-gray-50 dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700"
          ></div>
          <div
            class="h-10 bg-purple-100 dark:bg-purple-500/20 rounded-lg flex items-center justify-center text-[10px] font-bold text-purple-600 dark:text-purple-400 border border-purple-200 dark:border-purple-500/30"
          >
            7PM
          </div>
          <div
            class="h-10 bg-gray-50 dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700"
          ></div>
          <div
            class="h-10 bg-gray-50 dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700"
          ></div>
          <div
            class="h-10 bg-gray-50 dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700"
          ></div>
        </div>

        <div class="flex items-center gap-3 text-[11px] text-gray-400">
          <span class="flex items-center gap-1"
            ><span
              class="w-3 h-3 bg-indigo-200 dark:bg-indigo-500/30 rounded"
            ></span>
            Morning</span
          >
          <span class="flex items-center gap-1"
            ><span
              class="w-3 h-3 bg-purple-200 dark:bg-purple-500/30 rounded"
            ></span>
            Evening</span
          >
          <span class="flex items-center gap-1"
            ><span
              class="w-3 h-3 bg-emerald-200 dark:bg-emerald-500/30 rounded"
            ></span>
            Weekend</span
          >
        </div>
      </section>

      <!-- ═══ REMINDERS ═══ -->
      <section class="fade-in-up" style="animation-delay: 0.2s">
        <div class="flex items-center justify-between mb-4">
          <h2
            class="text-sm font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider"
          >
            Reminders
          </h2>
          <button
            onclick="showAddReminder()"
            class="text-xs text-emerald-600 dark:text-emerald-400 font-semibold hover:underline flex items-center gap-1"
          >
            <i class="fas fa-plus text-[10px]"></i> Add
          </button>
        </div>
        <div id="reminders-list" class="space-y-2"></div>
      </section>

      <!-- ─── Add Reminder Modal ─── -->
      <div
        id="add-reminder-modal"
        class="hidden fixed inset-0 z-[60] flex items-end sm:items-center justify-center"
      >
        <div
          class="absolute inset-0 bg-black/40"
          onclick="hideAddReminder()"
        ></div>
        <div
          class="relative bg-white dark:bg-gray-900 rounded-t-2xl sm:rounded-2xl w-full max-w-md p-6 border border-gray-200 dark:border-gray-800 shadow-2xl"
        >
          <h3 class="text-lg font-bold mb-4">New Reminder</h3>
          <div class="space-y-4">
            <div>
              <label
                class="text-sm font-semibold text-gray-600 dark:text-gray-300 mb-1 block"
                >Label</label
              >
              <input
                id="reminder-label"
                type="text"
                placeholder="e.g. Morning meditation"
                class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 text-gray-800 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:border-emerald-500 transition"
              />
            </div>
            <div>
              <label
                class="text-sm font-semibold text-gray-600 dark:text-gray-300 mb-1 block"
                >Time</label
              >
              <input
                id="reminder-time"
                type="time"
                value="08:00"
                class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 text-gray-800 dark:text-gray-100 focus:outline-none focus:border-emerald-500 transition"
              />
            </div>
            <div>
              <label
                class="text-sm font-semibold text-gray-600 dark:text-gray-300 mb-2 block"
                >Emoji</label
              >
              <div class="flex gap-2 flex-wrap">
                <button
                  onclick="pickEmoji('📚')"
                  class="emoji-pick text-2xl p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition"
                >
                  📚
                </button>
                <button
                  onclick="pickEmoji('🏃')"
                  class="emoji-pick text-2xl p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition"
                >
                  🏃
                </button>
                <button
                  onclick="pickEmoji('💰')"
                  class="emoji-pick text-2xl p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition"
                >
                  💰
                </button>
                <button
                  onclick="pickEmoji('💪')"
                  class="emoji-pick text-2xl p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition"
                >
                  💪
                </button>
                <button
                  onclick="pickEmoji('🧘')"
                  class="emoji-pick text-2xl p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition"
                >
                  🧘
                </button>
                <button
                  onclick="pickEmoji('✍️')"
                  class="emoji-pick text-2xl p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition"
                >
                  ✍️
                </button>
                <button
                  onclick="pickEmoji('🎯')"
                  class="emoji-pick text-2xl p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition"
                >
                  🎯
                </button>
                <button
                  onclick="pickEmoji('🧠')"
                  class="emoji-pick text-2xl p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition"
                >
                  🧠
                </button>
                <button
                  onclick="pickEmoji('🍎')"
                  class="emoji-pick text-2xl p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition"
                >
                  🍎
                </button>
                <button
                  onclick="pickEmoji('💤')"
                  class="emoji-pick text-2xl p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition"
                >
                  💤
                </button>
              </div>
            </div>
          </div>
          <div class="flex gap-3 mt-6">
            <button
              onclick="hideAddReminder()"
              class="flex-1 py-3 bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-300 font-bold rounded-xl"
            >
              Cancel
            </button>
            <button
              onclick="saveReminder()"
              class="flex-1 py-3 bg-gradient-to-r from-emerald-500 to-lime-500 text-white font-bold rounded-xl"
            >
              Save
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- ─── Bottom Navigation ─── -->
    <nav
      id="bottom-nav"
      class="fixed bottom-0 inset-x-0 bg-white/90 dark:bg-gray-900/90 glass border-t border-gray-200 dark:border-gray-800 z-50"
    ></nav>

    <script src="app.js"></script>
    <script>
      // ═══ Timer State ═══
      let timerTotal = 25 * 60; // seconds
      let timerRemaining = 25 * 60;
      let timerInterval = null;
      let timerRunning = false;
      let selectedEmoji = "📚";

      (function init() {
        initTheme();
        renderBottomNav("focus");
        renderReminders();
        updateTimerDisplay();
      })();

      // ═══ FOCUS TIMER ═══
      function setPreset(minutes) {
        if (timerRunning) stopTimer();
        timerTotal = minutes * 60;
        timerRemaining = timerTotal;
        updateTimerDisplay();
        document.getElementById("timer-label").textContent = "Ready";
        // Highlight active preset
        document
          .querySelectorAll(".preset-btn")
          .forEach((b) => b.classList.remove("bg-white/40"));
      }

      function toggleTimer() {
        timerRunning ? stopTimer() : startTimer();
      }

      function startTimer() {
        if (timerRemaining <= 0) {
          timerRemaining = timerTotal;
        }
        timerRunning = true;
        document.getElementById("timer-play-icon").className =
          "fas fa-pause text-xl";
        document.getElementById("timer-label").textContent = "Focusing...";
        timerInterval = setInterval(() => {
          timerRemaining--;
          updateTimerDisplay();
          if (timerRemaining <= 0) {
            stopTimer();
            document.getElementById("timer-label").textContent = "Done! 🎉";
            fireConfetti();
          }
        }, 1000);
      }

      function stopTimer() {
        timerRunning = false;
        clearInterval(timerInterval);
        document.getElementById("timer-play-icon").className =
          "fas fa-play text-xl ml-0.5";
        if (timerRemaining > 0)
          document.getElementById("timer-label").textContent = "Paused";
      }

      function resetTimer() {
        stopTimer();
        timerRemaining = timerTotal;
        updateTimerDisplay();
        document.getElementById("timer-label").textContent = "Ready";
      }

      function skipTimer() {
        stopTimer();
        timerRemaining = 0;
        updateTimerDisplay();
        document.getElementById("timer-label").textContent = "Skipped";
      }

      function updateTimerDisplay() {
        const m = Math.floor(timerRemaining / 60);
        const s = timerRemaining % 60;
        document.getElementById("timer-display").textContent =
          `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        // Update ring
        const circumference = 2 * Math.PI * 90; // 565.48
        const offset =
          timerTotal > 0
            ? circumference * (1 - timerRemaining / timerTotal)
            : 0;
        document
          .getElementById("timer-ring")
          .setAttribute("stroke-dashoffset", offset);
      }

      // ═══ REMINDERS ═══
      function renderReminders() {
        const data = getData();
        const list = document.getElementById("reminders-list");
        if (!data.reminders || !data.reminders.length) {
          list.innerHTML =
            '<p class="text-center text-gray-400 py-8 text-sm">No reminders yet.</p>';
          return;
        }

        // Sort by time
        const sorted = [...data.reminders].sort((a, b) =>
          (a.time || "").localeCompare(b.time || ""),
        );

        list.innerHTML = sorted
          .map(
            (r) => `
        <div class="bg-white dark:bg-gray-900 rounded-xl p-3.5 border border-gray-200 dark:border-gray-800 flex items-center gap-3 shadow-sm">
          <div class="text-2xl flex-shrink-0">${r.emoji || "⏰"}</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-gray-800 dark:text-gray-100 truncate">${r.label}</p>
            <p class="text-xs text-gray-400">${formatTime(r.time)}</p>
          </div>
          <button onclick="toggleReminder('${r.id}')" class="relative w-11 h-6 rounded-full ${r.enabled ? "bg-emerald-500" : "bg-gray-300 dark:bg-gray-700"} transition-colors flex-shrink-0">
            <div class="absolute top-0.5 w-5 h-5 bg-white rounded-full shadow-sm transition-all ${r.enabled ? "left-[22px]" : "left-[2px]"}"></div>
          </button>
          <button onclick="deleteReminder('${r.id}')" class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-300 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 transition">
            <i class="fas fa-times text-xs"></i>
          </button>
        </div>
      `,
          )
          .join("");
      }

      function toggleReminder(id) {
        updateData((d) => {
          const r = d.reminders.find((r) => r.id === id);
          if (r) r.enabled = !r.enabled;
        });
        renderReminders();
      }

      function deleteReminder(id) {
        updateData((d) => {
          d.reminders = d.reminders.filter((r) => r.id !== id);
        });
        renderReminders();
      }

      // ─── Add Reminder Modal ───
      function showAddReminder() {
        document
          .getElementById("add-reminder-modal")
          .classList.remove("hidden");
        document.getElementById("reminder-label").value = "";
        document.getElementById("reminder-time").value = "08:00";
        selectedEmoji = "📚";
      }

      function hideAddReminder() {
        document.getElementById("add-reminder-modal").classList.add("hidden");
      }

      function pickEmoji(emoji) {
        selectedEmoji = emoji;
        document.querySelectorAll(".emoji-pick").forEach((el) => {
          el.classList.remove(
            "bg-emerald-100",
            "dark:bg-emerald-500/20",
            "ring-2",
            "ring-emerald-500",
          );
        });
        event.currentTarget.classList.add(
          "bg-emerald-100",
          "dark:bg-emerald-500/20",
          "ring-2",
          "ring-emerald-500",
        );
      }

      function saveReminder() {
        const label = document.getElementById("reminder-label").value.trim();
        const time = document.getElementById("reminder-time").value;
        if (!label) {
          alert("Please enter a label.");
          return;
        }
        updateData((d) => {
          if (!d.reminders) d.reminders = [];
          d.reminders.push({
            id: gid(),
            label,
            time,
            emoji: selectedEmoji,
            enabled: true,
          });
        });
        hideAddReminder();
        renderReminders();
      }
    </script>
  </body>
</html>
